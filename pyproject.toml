[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-confidence-calibrator"
version = "0.1.0"
description = "Hallucination prevention score calculator comparing retrieved source snippet embeddings against generated claim statements"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
rag-confidence-calibrator = "rag_confidence_calibrator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rag_confidence_calibrator*"]
